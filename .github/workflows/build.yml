name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x server/mvnw

      - name: Test server
        working-directory: server
        run: ./mvnw -B test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports
          path: server/target/surefire-reports
          if-no-files-found: ignore

  build:
    name: build (${{ matrix.component }})
    needs: test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            os: ubuntu-latest
          - component: client
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        if: matrix.component == 'server'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven wrapper executable
        if: matrix.component == 'server'
        run: chmod +x server/mvnw

      - name: Build server
        if: matrix.component == 'server'
        working-directory: server
        run: ./mvnw -B package -DskipTests

      - name: Upload server artifact
        if: matrix.component == 'server'
        uses: actions/upload-artifact@v4
        with:
          name: InfoGuardServer-jar
          path: server/target/server-0.0.1-SNAPSHOT.jar
          if-no-files-found: error

      - name: Configure client
        if: matrix.component == 'client'
        run: cmake -S . -B build -A x64

      - name: Build Windows binaries
        if: matrix.component == 'client'
        run: cmake --build build --config Release --target InfoGuardTrayApp InfoGuardService

      - name: Install Inno Setup
        if: matrix.component == 'client'
        run: choco install innosetup --no-progress -y

      - name: Build installer
        if: matrix.component == 'client'
        run: |
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }
          & $iscc "installer\InfoGuardInstaller.iss"

      - name: Upload Windows artifacts
        if: matrix.component == 'client'
        uses: actions/upload-artifact@v4
        with:
          name: InfoGuard-windows-binaries
          path: |
            build/Release/InfoGuardTrayApp.exe
            build/Release/InfoGuardService.exe
          if-no-files-found: error

      - name: Upload installer artifact
        if: matrix.component == 'client'
        uses: actions/upload-artifact@v4
        with:
          name: InfoGuard-windows-installer
          path: build/installer/InfoGuardAntivirusSetup.exe
          if-no-files-found: error
