services:
  postgres:
    image: postgres:17
    container_name: infoguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: infoguard_db
      POSTGRES_USER: infoguard
      POSTGRES_PASSWORD: infoguard
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
